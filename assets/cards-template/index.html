<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — 学习卡片</title>
<meta name="description" content="交互式学习卡片 — {{TITLE}}">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="progress-bar" id="progressBar" aria-hidden="true"></div>

<div class="top-bar" id="topBar">
  <span>{{TITLE_SHORT}}</span>
  <div class="top-bar-right">
    <span id="cardCounter"></span>
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换亮色/暗色主题">🌓</button>
  </div>
</div>

<nav class="nav-dots" id="navDots" aria-label="卡片导航">
  {{NAV_DOTS_HTML}}
</nav>

<main class="deck" id="deck">
  {{HERO_CARD_HTML}}
  {{THEME_CARDS_HTML}}
  {{CLOSING_CARD_HTML}}
</main>

<div class="bottom-nav" id="bottomNav">
  <button id="prevCard" aria-label="上一张卡片">← 上一张</button>
  <span class="card-counter" id="mobileCounter"></span>
  <button id="nextCard" aria-label="下一张卡片">下一张 →</button>
</div>

<script src="script.js"></script>
</body>
</html>
